<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TH POST - ผลการติดตามพัสดุ</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="topbar">
<span class="brand">TH POST – ผลการติดตามพัสดุ</span>
</div>

<div class="container">
<div class="card">

<h2 id="title">ผลการติดตามพัสดุ</h2>

<div id="loading">กำลังค้นหาข้อมูล...</div>

<div id="resultArea" class="hidden">

<table>

<tr>
<td class="label">เลขพัสดุ</td>
<td id="showCode"></td>
</tr>

<tr>
<td class="label">จังหวัด</td>
<td id="showProvince"></td>
</tr>

<tr>
<td class="label">อำเภอ</td>
<td id="showDistrict"></td>
</tr>
  
<tr>
<td class="label">ชื่อผู้รับ</td>
<td id="showReceiver"></td>
</tr>

<tr>
<td class="label">ที่อยู่</td>
<td id="showAddress"></td>
</tr>
<tr>
<td class="label">สถานะ</td>
<td id="showStatus"></td>
</tr>

<tr>
<td class="label">อัปเดตล่าสุด</td>
<td id="showUpdated"></td>
</tr>

</table>

<div class="timeline">

<div id="s1" class="step">
📦 รับพัสดุ
</div>

<div id="s2" class="step">
⚙️ คัดแยก
</div>

<div id="s3" class="step">
🚚 นำจ่าย
</div>

<div id="s4" class="step">
✅ นำจ่ายสำเร็จ
</div>

</div>

</div>

<button class="secondary" onclick="goBack()">กลับหน้าหลัก</button>

</div>
</div>

<script src="result.js"></script>

</body>
</html>
